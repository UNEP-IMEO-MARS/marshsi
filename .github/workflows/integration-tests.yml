name: Integration Tests

# Runs the docs/ notebooks as integration tests (downloading real PRISMA /
# EnMAP / EMIT data). These are expensive and need cloud credentials, so they
# do not run on every push. Instead they run:
#   * on demand via the "Run workflow" button (workflow_dispatch), and
#   * once each time the `integration-tests` label is added to a pull request
#     (the label is then removed automatically so it can be re-added to re-run).

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  notebook-tests:
    name: Run notebook integration tests
    runs-on: ubuntu-latest
    # Run on manual dispatch, or when the `integration-tests` label is added to a PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'integration-tests'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev,docs,tutorial --no-interaction

      - name: Run notebook integration tests
        env:
          SAS_TOKEN: ${{ secrets.SAS_TOKEN }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: make test-notebooks

      # Remove the label again so re-adding it re-triggers the suite (like the internal MARS pipeline).
      # Skipped on manual dispatch (no PR number).
      - name: Remove integration-tests label
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --remove-label "integration-tests" -R ${{ github.repository }} \
            || echo "Label 'integration-tests' not present"
