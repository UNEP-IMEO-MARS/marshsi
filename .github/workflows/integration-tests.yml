name: Integration Tests

# Runs the docs/ notebooks as integration tests (downloading real PRISMA /
# EnMAP / EMIT data). These are expensive and need cloud credentials, so they
# do not run on every push. Instead they run:
#   * on demand via the "Run workflow" button (workflow_dispatch), and
#   * when the `integration-tests` label is present on a pull request.
#
# To require them before merging to main, add this job's check
# ("Run notebook integration tests") to the branch protection rules for `main`
# as a required status check. A PR without the label leaves the check pending,
# so it must be labelled (which triggers the run) before it can be merged.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  notebook-tests:
    name: Run notebook integration tests
    runs-on: ubuntu-latest
    # Run on manual dispatch, or whenever the PR carries the integration-tests label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'integration-tests')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev,docs,tutorial --no-interaction

      - name: Run notebook integration tests
        env:
          SAS_TOKEN: ${{ secrets.SAS_TOKEN }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: make test-notebooks
