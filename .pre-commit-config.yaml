# Pre-commit guardrails for this PUBLIC repository.
#
# One-time setup:   poetry run pre-commit install
# Run on demand:    poetry run pre-commit run --all-files   (also part of: make check)
#
# Focus is leak prevention, not formatting (ruff/mypy live in the Makefile).
minimum_pre_commit_version: "3.0.0"
repos:
  # Generic secret detection (keys, tokens, SAS, connection strings, JWTs).
  # Configuration + allowlist for mock .env.sample secrets is in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
        exclude: '\.env\.sample$'   # ships an intentional MOCK token
      - id: check-merge-conflict

  # Project-specific: block internal MARS infrastructure references.
  - repo: local
    hooks:
      - id: mars-internal-refs
        name: Block internal MARS references (public repo)
        entry: scripts/check_internal_refs.sh
        language: script
        types: [text]
        # Notebooks are scanned by gitleaks for secrets only; docs/*_example.ipynb
        # outputs are intentional (rendered into the public docs) and left as-is.
        exclude: '\.ipynb$|\.env\.(sample|example)$|^scripts/\.internal-blocklist'
        require_serial: true
